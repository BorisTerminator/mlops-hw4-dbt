# Хуки запускаются на каждый git commit после `pre-commit install` (или `make pre-commit`).
# Конфиг лежит в корне репозитория: pre-commit ищет его именно там.
#
# sqlfluff работает с dbt-шаблонизатором (настройки в dbt/.sqlfluff), поэтому перед
# коммитом нужны поднятый ClickHouse и установленные пакеты dbt (make up && make deps).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]

  - repo: https://github.com/sqlfluff/sqlfluff
    rev: 3.5.0
    hooks:
      - id: sqlfluff-lint
        args: [--dialect, clickhouse]
        files: ^dbt/(models|tests)/.*\.sql$
        additional_dependencies:
          - sqlfluff-templater-dbt==3.5.0
          - dbt-core==1.12.6
          - dbt-clickhouse==1.10.3
      - id: sqlfluff-fix
        args: [--dialect, clickhouse]
        files: ^dbt/(models|tests)/.*\.sql$
        additional_dependencies:
          - sqlfluff-templater-dbt==3.5.0
          - dbt-core==1.12.6
          - dbt-clickhouse==1.10.3
