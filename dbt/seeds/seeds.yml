version: 2

seeds:
  - name: states
    description: >
      Справочник штатов США: код, полное название, регион и подрайон по классификации
      Бюро переписи (Census Bureau). 50 штатов и округ Колумбия, как в данных транзакций.
    config:
      column_types:
        state_code: LowCardinality(String)
        state_name: String
        region: LowCardinality(String)
        division: LowCardinality(String)
    columns:
      - name: state_code
        description: Двухбуквенный почтовый код штата, ключ справочника.
        data_tests:
          - not_null
          - unique
          - dbt_expectations.expect_column_value_lengths_to_equal:
              arguments:
                value: 2
      - name: state_name
        description: Полное название штата.
        data_tests:
          - not_null
          - unique
      - name: region
        description: Регион США по классификации Бюро переписи.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["Northeast", "Midwest", "South", "West"]
      - name: division
        description: Подрайон внутри региона (9 штук).
        data_tests:
          - not_null
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal:
          arguments:
            value: 51
